{% extends "base.html" %}

{% block title %}Goals — SpendIntel{% endblock %}

{% block content %}
<div class="space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center">
        <div>
            <h1 class="font-display font-bold text-2xl md:text-3xl text-slate-900 dark:text-white">Savings Milestones</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Set and monitor targets for your university expenditures</p>
        </div>
        <button onclick="openGoalModal()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium shadow-md text-sm flex items-center gap-2 transition-all">
            <i class="fa-solid fa-plus"></i> Set New Target
        </button>
    </header>

    <!-- Goals Card Grid -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="goalsGrid">
        <div class="col-span-full py-12 text-center text-slate-400 text-sm">
            Loading savings goals...
        </div>
    </section>
</div>

<!-- Goal Configuration Modal -->
<div id="goalModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-sm hidden">
    <div class="w-full max-w-md bg-white dark:bg-darkCard p-6 rounded-2xl border border-lightBorder dark:border-darkBorder shadow-xl space-y-4">
        
        <div class="flex justify-between items-center border-b border-lightBorder dark:border-darkBorder pb-3">
            <h3 class="font-display font-bold text-lg text-slate-900 dark:text-white" id="modalTitle">Set Savings Target</h3>
            <button onclick="closeGoalModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form id="goalForm" class="space-y-4">
            <!-- Hidden inputs -->
            <input type="hidden" id="goalId">

            <!-- Title -->
            <div class="space-y-1">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Goal Title / Milestone *</label>
                <input type="text" id="goalTitle" placeholder="e.g. New Coding Laptop, Summer Internship Trip" required
                       class="w-full px-3 py-2 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Target Amount -->
                <div class="space-y-1">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Target Amount (₹) *</label>
                    <input type="number" id="goalTarget" min="1" placeholder="e.g. 60000" required
                           class="w-full px-3 py-2 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none">
                </div>
                <!-- Current Saved -->
                <div class="space-y-1">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Already Saved (₹)</label>
                    <input type="number" id="goalCurrent" min="0" placeholder="e.g. 15000"
                           class="w-full px-3 py-2 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none">
                </div>
            </div>

            <!-- Deadline -->
            <div class="space-y-1">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Target Deadline Date *</label>
                <input type="date" id="goalDeadline" required
                       class="w-full px-3 py-2 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none">
            </div>

            <!-- Description -->
            <div class="space-y-1">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Goal Description</label>
                <textarea id="goalDescription" rows="2" placeholder="e.g. Save money from monthly allowance to avoid taking loans."
                          class="w-full px-3 py-2 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none"></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-lightBorder dark:border-darkBorder">
                <button type="button" onclick="closeGoalModal()" class="px-4 py-2 text-sm font-semibold text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-all">
                    Cancel
                </button>
                <button type="submit" class="px-5 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-all">
                    Save Target
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/goals.js') }}"></script>
{% endblock %}
