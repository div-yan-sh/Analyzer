{% extends "base.html" %}

{% block title %}Sign Up — SpendIntel{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-6">
    <div class="bg-white dark:bg-darkCard p-8 rounded-2xl border border-lightBorder dark:border-darkBorder shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white text-xl shadow-lg mb-1">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="font-display font-bold text-2xl text-slate-900 dark:text-white">Create Student Account</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Join SpendIntel and master your pocket finances</p>
        </div>

        <!-- Google One-Click Sign Up -->
        <div class="space-y-2.5">
            <a href="/api/auth/google/login" class="w-full py-2.5 px-4 rounded-xl border border-lightBorder dark:border-darkBorder bg-white dark:bg-[#111723] hover:bg-slate-50 dark:hover:bg-[#1E293B] text-slate-700 dark:text-slate-200 font-semibold text-sm shadow-xs flex items-center justify-center gap-3 transition-all duration-200 hover:shadow-md group">
                <svg class="w-4 h-4 transition-transform group-hover:scale-110" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign up with Google</span>
            </a>
        </div>

        <div class="relative flex items-center justify-center">
            <div class="border-t border-lightBorder dark:border-darkBorder w-full"></div>
            <span class="bg-white dark:bg-darkCard px-3 text-xs font-medium text-slate-400 uppercase tracking-wider absolute">or fill details</span>
        </div>

        <form id="registerForm" class="space-y-4">
            <!-- Alert Container -->
            <div id="alertBox" class="hidden p-3 rounded-lg text-sm font-medium border"></div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Name -->
                <div class="space-y-1.5">
                    <label for="name" class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Full Name</label>
                    <input type="text" id="name" required placeholder="Divya" 
                           class="w-full px-4 py-2.5 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
                </div>

                <!-- Email -->
                <div class="space-y-1.5">
                    <label for="email" class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Email Address</label>
                    <input type="email" id="email" required placeholder="student@college.edu" 
                           class="w-full px-4 py-2.5 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Password -->
                <div class="space-y-1.5">
                    <label for="password" class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full px-4 py-2.5 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
                </div>

                <!-- Monthly Allowance -->
                <div class="space-y-1.5">
                    <label for="allowance" class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Monthly Allowance (<span class="currency-symbol">₹</span>)</label>
                    <input type="number" id="allowance" min="0" value="15000" step="500" required
                           class="w-full px-4 py-2.5 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- College -->
                <div class="sm:col-span-2 space-y-1.5">
                    <label for="college" class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">University / College</label>
                    <input type="text" id="college" required placeholder="State Institute of Tech" 
                           class="w-full px-4 py-2.5 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
                </div>

                <!-- Year -->
                <div class="space-y-1.5">
                    <label for="year" class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Current Year</label>
                    <select id="year" class="w-full px-4 py-2.5 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-950 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3" selected>3rd Year</option>
                        <option value="4">4th Year</option>
                        <option value="5">5th Year</option>
                    </select>
                </div>
            </div>

            <!-- Course -->
            <div class="space-y-1.5">
                <label for="course" class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Course / Branch</label>
                <input type="text" id="course" required placeholder="B.Tech Computer Science" 
                       class="w-full px-4 py-2.5 rounded-xl border border-lightBorder dark:border-darkBorder bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold shadow-md hover:shadow-lg transition-all duration-200 text-sm">
                Create Account
            </button>
        </form>

        <div class="text-center pt-4 border-t border-lightBorder dark:border-darkBorder">
            <span class="text-xs text-slate-500 dark:text-slate-400">Already have an account?</span>
            <a href="/login" class="text-xs font-semibold text-blue-600 dark:text-blue-400 ml-1 hover:underline">Log in</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
